<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" type="text/css" href="./style.css">
  
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  <main class="card">

    <picture>
        <source media="(min-width: 600px)" srcset="images/image-product-desktop.jpg">
        <img src="images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum">
    </picture>
    
    <div class="content">
      <p class="directory">PERFUME</p>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>

      <div class="price">
        <span class="actual-price">$149.99</span>
        <span class="origin-price">$169.99</span>
      </div>  

      <button type="button" class="btn">
        <img src="images/icon-cart.svg" alt=""> Add to Cart
      </button>
    </div>
    
  </main>  
   
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" class="attribution-link" target="_blank" rel="noopener">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Saliva-sys" class="attribution-link" target="_blank" rel="noopener">Adriana Weidlichova</a>.
  </footer>
</body>
</html>
